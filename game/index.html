<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle Station — a cooking game</title>
<style>
  html, body { margin: 0; padding: 0; background: #241811; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block;
    box-sizing: border-box;
    width: min(100vw, calc(100vh * 1280 / 720));
    height: min(100vh, calc(100vw * 720 / 1280));
    background: #ffd29b;
    cursor: pointer;
    border: 4px solid #3a2417;
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 4px 0 rgba(0, 0, 0, 0.35);
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
